<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>照拿藥表單</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #faf9f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      color: #35694b;
      letter-spacing: 2px;
    }

    .loader {
      width: 52px;
      height: 52px;
      border: 5px solid #e3eee6;
      border-top: 5px solid #4f8a63;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .subtitle {
      font-size: 15px;
      color: #888;
      letter-spacing: 1px;
    }

    .dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dots {
      0% {
        content: "";
      }

      25% {
        content: ".";
      }

      50% {
        content: "..";
      }

      75% {
        content: "...";
      }

      100% {
        content: "";
      }
    }

    .error-message {
      display: none;
      max-width: 300px;
      text-align: center;
      line-height: 1.7;
      color: #666;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="loading-container" id="loading">

    <div class="logo">
      瑞恩中醫
    </div>

    <div class="loader"></div>

    <div class="subtitle">
      照拿藥表單載入中<span class="dots"></span>
    </div>

    <div class="error-message" id="errorMessage">
      系統連線稍有延遲，正在為您開啟表單。
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {

      try {

        console.log("LIFF 初始化");

        await liff.init({
          liffId: "2011216294-Ug0co1AC"
        });

        if (!liff.isLoggedIn()) {

          console.log("尚未登入 LINE");

          liff.login();

          return;
        }

        console.log("LINE 已登入");

        await sendUserDataAndRedirect();

      } catch (err) {

        console.error(
          "LIFF 初始化失敗:",
          err
        );

        showError();

        setTimeout(() => {
          redirectToGoogleForm();
        }, 1500);

      }

    });



    async function sendUserDataAndRedirect() {

      try {

        const profile =
          await liff.getProfile();


        console.log(
          "LINE 使用者名稱:",
          profile.displayName
        );

        console.log(
          "LINE User ID:",
          profile.userId
        );


        // ==============================
        // 儲存 LINE 資料
        // ==============================

        localStorage.setItem(
          "userName",
          profile.displayName
        );

        localStorage.setItem(
          "userId",
          profile.userId
        );


        // ==============================
        // Google Apps Script
        // ==============================

        const gasURL =
          "https://script.google.com/macros/s/AKfycbzYuqjj4MuS8MOcwZ4vmNGwLahX03TmXeKZIvF0IZ5Anqotl3K8818LVqm5M_3b7axlWg/exec";


        const url =
          `${gasURL}` +
          `?userName=${encodeURIComponent(profile.displayName)}` +
          `&userId=${encodeURIComponent(profile.userId)}`;


        await fetch(
          url,
          {
            mode: "no-cors"
          }
        );


        console.log(
          "LINE 使用者資料已送出"
        );


        // ==============================
        // Google Form
        // ==============================

        const formBase =
          "https://docs.google.com/forms/d/e/1FAIpQLSeh5f7ZzfHBSDrI5XzpQBK8NS94B4thOr9B4gw1GgFppfW5xA/viewform?usp=header";


        const entryName =
          "entry.1359086443";


        const finalFormURL =
          `${formBase}` +
          `&${entryName}=${encodeURIComponent(profile.displayName)}`;


        console.log(
          "前往照拿藥表單"
        );


        window.location.replace(
          finalFormURL
        );


      } catch (err) {

        console.error(
          "使用者資料處理失敗:",
          err
        );

        showError();

        setTimeout(() => {
          redirectToGoogleForm();
        }, 1500);

      }

    }



    function showError() {

      const errorMessage =
        document.getElementById("errorMessage");

      if (errorMessage) {
        errorMessage.style.display = "block";
      }

    }



    function redirectToGoogleForm() {

      window.location.replace(
        "https://docs.google.com/forms/d/e/1FAIpQLSeh5f7ZzfHBSDrI5XzpQBK8NS94B4thOr9B4gw1GgFppfW5xA/viewform?usp=header"
      );

    }

  </script>

</body>
</html>
