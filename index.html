<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>照拿藥表單</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #faf9f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    /* 照拿藥圖示 */
    .medicine-icon {
      width: 150px;
      max-width: 42vw;
      height: auto;

      animation:
        floatIcon 1.8s ease-in-out infinite;

      filter:
        drop-shadow(
          0 10px 15px rgba(0, 0, 0, 0.08)
        );
    }

    /* 上下浮動 */
    @keyframes floatIcon {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #35694b;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      letter-spacing: 1px;
    }

    /* 三點波浪 */
    .wave-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      height: 25px;
    }

    .wave-dots span {
      width: 9px;
      height: 9px;
      background: #4f8a63;
      border-radius: 50%;

      animation:
        waveDot 1.2s ease-in-out infinite;
    }

    .wave-dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .wave-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .wave-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes waveDot {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-9px);
        opacity: 1;
      }

    }

    .error-message {
      display: none;
      margin-top: 6px;
      max-width: 280px;
      font-size: 14px;
      color: #777;
      line-height: 1.6;
    }

  </style>
</head>

<body>

  <div class="loading-container">

    <!--
      圖片放在：
      /images/medicine-form.png
    -->
<img
  class="medicine-icon"
  src="./medicine-form.png"
  alt="照拿藥表單"
>
    <div class="title">
      照拿藥表單
    </div>

    <div class="subtitle">
      正在確認您的 LINE 身分
    </div>

    <!-- 三點波浪 -->
    <div class="wave-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div
      class="error-message"
      id="errorMessage"
    >
      系統連線稍有延遲，正在為您開啟表單。
    </div>

  </div>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          console.log(
            "LIFF 初始化"
          );


          // ==============================
          // LIFF 初始化
          // ==============================

          await liff.init({

            liffId:
              "2011216294-Ug0co1AC"

          });


          // ==============================
          // 尚未登入 LINE
          // ==============================

          if (
            !liff.isLoggedIn()
          ) {

            console.log(
              "尚未登入 LINE"
            );

            liff.login();

            return;
          }


          console.log(
            "LINE 已登入"
          );


          await sendUserDataAndRedirect();


        } catch (err) {

          console.error(
            "LIFF 初始化失敗:",
            err
          );


          showError();


          setTimeout(() => {

            redirectToGoogleForm();

          }, 1500);

        }

      }
    );



    async function sendUserDataAndRedirect() {

      try {

        // ==============================
        // 取得 LINE Profile
        // ==============================

        const profile =
          await liff.getProfile();


        console.log(
          "LINE 使用者名稱:",
          profile.displayName
        );


        console.log(
          "LINE User ID:",
          profile.userId
        );



        // ==============================
        // 暫存 localStorage
        // ==============================

        localStorage.setItem(
          "userName",
          profile.displayName
        );


        localStorage.setItem(
          "userId",
          profile.userId
        );



        // ==============================
        // Google Apps Script
        // ==============================

        const gasURL =
          "https://script.google.com/macros/s/AKfycbzYuqjj4MuS8MOcwZ4vmNGwLahX03TmXeKZIvF0IZ5Anqotl3K8818LVqm5M_3b7axlWg/exec";


        const url =
          `${gasURL}` +
          `?userName=${encodeURIComponent(profile.displayName)}` +
          `&userId=${encodeURIComponent(profile.userId)}`;


        await fetch(
          url,
          {
            mode: "no-cors"
          }
        );


        console.log(
          "LINE 使用者資料已送出"
        );



        // ==============================
        // Google Form
        // ==============================

        const formBase =
          "https://docs.google.com/forms/d/e/1FAIpQLSeh5f7ZzfHBSDrI5XzpQBK8NS94B4thOr9B4gw1GgFppfW5xA/viewform?usp=header";


        const entryName =
          "entry.1359086443";


        const finalFormURL =
          `${formBase}` +
          `&${entryName}=${encodeURIComponent(profile.displayName)}`;



        console.log(
          "前往照拿藥表單"
        );


        // 稍微停留一下，
        // 讓 Loading 動畫不會瞬間消失
        setTimeout(() => {

          window.location.replace(
            finalFormURL
          );

        }, 600);


      } catch (err) {

        console.error(
          "使用者資料處理失敗:",
          err
        );


        showError();


        setTimeout(() => {

          redirectToGoogleForm();

        }, 1500);

      }

    }



    function showError() {

      const errorMessage =
        document.getElementById(
          "errorMessage"
        );


      if (errorMessage) {

        errorMessage.style.display =
          "block";

      }

    }



    function redirectToGoogleForm() {

      window.location.replace(
        "https://docs.google.com/forms/d/e/1FAIpQLSeh5f7ZzfHBSDrI5XzpQBK8NS94B4thOr9B4gw1GgFppfW5xA/viewform?usp=header"
      );

    }

  </script>

</body>
</html>
